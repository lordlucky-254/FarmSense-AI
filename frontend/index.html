<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarmSense AI</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">FARMSENSE AI</p><h1>One clear view of what your farm is telling you.</h1><p>Combine weather and observations into a short, verifiable action list.</p></header><section class="card"><label>Location<input id="location" value="Kenya"></label><label>Rain probability<input id="rain" type="number" min="0" max="100" value="80">%</label><label>Crop symptoms<input id="crop" placeholder="e.g. yellow leaves"></label><label>Poultry symptoms<input id="poultry" placeholder="e.g. low appetite"></label><button id="run">Generate advice</button><pre id="result">Your farm snapshot will appear here.</pre></section></main><script src="app.js"></script></body></html>
